# ╔══════════════════════════════════════════════════════════════════╗
# ║  Promediatum — Auto-Update Configuration (electron-updater)    ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# This file is read by electron-updater when checking for app updates.
# When the app is built with NativePHP, electron-updater uses this
# configuration to determine where to look for updates.
#
# Provider: GitHub Releases
# The app checks the configured GitHub repository for new releases.
# Releases must include platform-specific artifacts (.dmg, .exe, etc.)
# generated by `php artisan native:build`.
#
# Security:
# - All releases should be signed (macOS code signing / Windows authenticode).
# - electron-updater verifies signatures automatically.
# - The GITHUB_TOKEN is only needed for private repositories.
#
# Release Channels:
# - "latest"  → Stable releases (default)
# - "beta"    → Pre-release tags (e.g., v1.1.0-beta.1)
#
# To publish an update:
# 1. Increment NATIVEPHP_APP_VERSION in .env
# 2. Increment version in config/version.php
# 3. Run: make native-build
# 4. Create a GitHub Release with the version tag (e.g., v1.1.0)
# 5. Upload the build artifacts to the release
# 6. Publish the release (or leave as draft if GITHUB_RELEASE_TYPE=draft)

provider: github
owner: HoujouSxnnyside
repo: promediatum
private: false
channel: stable
releaseType: release
