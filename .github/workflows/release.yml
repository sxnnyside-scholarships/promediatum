name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Desktop Release (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            sidecar_url: 'https://github.com/php/frankenphp/releases/download/v1.12.7/frankenphp-mac-arm64'
            sidecar_dest: 'src-tauri/binaries/frankenphp-aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--target x86_64-unknown-linux-gnu'
            sidecar_url: 'https://github.com/php/frankenphp/releases/download/v1.12.7/frankenphp-linux-x86_64'
            sidecar_dest: 'src-tauri/binaries/frankenphp-x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: '--target x86_64-pc-windows-msvc'
            sidecar_url: 'https://github.com/php/frankenphp/releases/download/v1.12.7/frankenphp-windows-x86_64.zip'
            sidecar_dest: 'src-tauri/binaries/frankenphp-x86_64-pc-windows-msvc.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Just
        uses: extractions/setup-just@v2

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Project Dependencies
        run: just install

      - name: Setup FrankenPHP Sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            curl -fSL -o frankenphp.zip "${{ matrix.sidecar_url }}"
            unzip frankenphp.zip frankenphp.exe
            mv frankenphp.exe "${{ matrix.sidecar_dest }}"
          else
            curl -fSL -o "${{ matrix.sidecar_dest }}" "${{ matrix.sidecar_url }}"
            chmod +x "${{ matrix.sidecar_dest }}"
          fi

      - name: Build Frontend
        run: just build-frontend

      - name: Build Desktop Application and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Promediatum v__VERSION__'
          releaseBody: 'See [CHANGELOG.md](https://github.com/sxnnyside-scholarships/promediatum/blob/main/CHANGELOG.md) for full release notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
